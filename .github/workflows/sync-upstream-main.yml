# Fork main is a mirror; make personal changes on feature branches.
# Stored upstream so synced forks retain the same main history.
# The personal fork alone runs this scheduled job.
# UPSTREAM_SYNC_SSH_KEY is the personal fork's write-enabled deploy key, so workflow updates sync too.
name: Sync upstream main

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'devxiyang'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the organization upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          expected="octoii-works/${GH_REPO#*/}"
          actual="$(gh api "repos/$GH_REPO" --jq '.parent.full_name // empty')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected upstream $expected, found $actual."
            exit 1
          fi
          printf 'repository=%s\n' "$expected" >> "$GITHUB_OUTPUT"

      - name: Check out main with the fork's sync key
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Fast-forward main from the organization repository
        shell: bash
        env:
          UPSTREAM: ${{ steps.upstream.outputs.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/$UPSTREAM.git" main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Fork main has commits absent from upstream. Resolve them manually before syncing."
            exit 1
          fi
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:refs/heads/main
          echo "Synchronized main from $UPSTREAM." >> "$GITHUB_STEP_SUMMARY"

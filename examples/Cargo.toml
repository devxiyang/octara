[package]
name = "octara-examples"
description = "Example apps, headless acceptance tests and CPU tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

# `octara check` / `inspect` / `run` call the counter's application entry.
[package.metadata.octara]
entry = "octara_examples::apps::counter_app"

[features]
system-fonts = ["octara-pipeline/system-fonts"]

[dependencies]
octara.workspace = true
octara-fonts.workspace = true
octara-icons.workspace = true
octara-inspect.workspace = true
octara-kit.workspace = true
octara-markdown = { workspace = true, features = ["composer", "math", "media"] }
octara-pipeline.workspace = true
octara-render.workspace = true
png.workspace = true
serde_json.workspace = true

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"

[package]
name = "octara-examples"
description = "Example apps, their acceptance tests and benchmarks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `octara check` / `inspect` / `run` drive this view.
[package.metadata.octara]
view = "octara_examples::apps::counter"

[dependencies]
octara = { workspace = true, features = ["system-fonts"] }
octara-fonts.workspace = true
octara-icons.workspace = true
octara-kit.workspace = true
octara-render.workspace = true
octara-shell.workspace = true

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"

[[bin]]
name = "window"
path = "src/bin/window.rs"

[package]
name = "octara-examples"
description = "Example apps, their acceptance tests and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `octara check` / `inspect` / `run` call the counter's application entry.
[package.metadata.octara]
entry = "octara_examples::apps::counter_app"

[dependencies]
octara-primitives.workspace = true
octara = { workspace = true, features = ["system-fonts"] }
octara-fonts.workspace = true
octara-icons.workspace = true
octara-kit.workspace = true
octara-render.workspace = true
octara-shell.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
pollster.workspace = true

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"

[[bin]]
name = "window"
path = "src/bin/window.rs"

[dev-dependencies]
octara-text.workspace = true

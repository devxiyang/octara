[package]
name = "octara-video"
description = "Opt-in video playback for Octara on Apple platforms and the Web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["platform"]
platform = [
    "dep:objc2", "dep:objc2-app-kit", "dep:objc2-core-graphics", "dep:objc2-foundation", "dep:objc2-quartz-core",
    "dep:objc2-ui-kit", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys",
]

[dependencies]
octara.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-core-graphics = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-quartz-core = { workspace = true, optional = true, features = ["CALayer", "CAShapeLayer"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std", "UIEvent", "UIResponder", "UIView", "UIViewController", "objc2-core-foundation", "objc2-quartz-core",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
web-sys = { version = "0.3.107", optional = true, features = ["Document", "Element", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "Node", "Url"] }

[package]
name = "octara-webview"
description = "Typed WebKit and browser views for Octara"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["platform"]
platform = [
    "dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-core-graphics", "dep:objc2-foundation",
    "dep:objc2-quartz-core", "dep:objc2-ui-kit", "dep:objc2-web-kit", "dep:wasm-bindgen", "dep:web-sys",
]

[dependencies]
octara.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2.5.9"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-core-graphics = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-quartz-core = { workspace = true, optional = true, features = ["CALayer", "CAShapeLayer", "objc2-core-graphics"] }
objc2-web-kit = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { workspace = true, optional = true, features = [
    "std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core",
    "UIEvent", "UIGeometry", "UIImage", "UIResponder", "UIView",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2.130", optional = true }
web-sys = { version = "0.3.107", optional = true, features = [
    "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlIFrameElement", "Node",
] }

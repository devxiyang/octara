[package]
name = "octara-chat"
description = "The AI chat reference app: a chat built from Octara's general mechanisms and kit components, answered by an offline scripted model."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `octara check` / `inspect` / `run` drive this view.
[package.metadata.octara]
view = "octara_chat::app"

[dependencies]
octara = { workspace = true, features = ["system-fonts"] }
octara-icons.workspace = true
octara-kit.workspace = true
octara-shell.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "octara-chat"
path = "src/main.rs"

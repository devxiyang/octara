[package]
name = "octara-chat"
description = "The AI chat reference app: Octara components with offline or HTTP streaming models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `octara check` / `inspect` / `run` use this startup entry.
[package.metadata.octara]
entry = "octara_chat::app"

[dependencies]
octara = { workspace = true, features = ["system-fonts"] }
octara-icons.workspace = true
octara-kit.workspace = true
octara-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net"] }

[[bin]]
name = "octara-chat"
path = "src/main.rs"

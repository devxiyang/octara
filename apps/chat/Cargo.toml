[package]
name = "octara-chat"
description = "The AI chat reference app: Octara components with offline or HTTP streaming models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

# `octara check` / `inspect` / `run` use this startup entry.
[package.metadata.octara]
entry = "octara_chat::startup"

[dependencies]
octara.workspace = true
octara-icons.workspace = true
octara-kit.workspace = true
octara-markdown = { workspace = true, features = ["composer", "math", "media"] }
octara-picker.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net"] }

[dev-dependencies]
octara-inspect.workspace = true
tempfile.workspace = true

[workspace]
resolver = "3"
members = ["crates/octara", "crates/octara-cli", "crates/octara-fonts", "crates/octara-icons", "crates/octara-kit", "crates/octara-render", "crates/octara-shell", "examples"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
version = "0.0.0"

[workspace.dependencies]
accesskit = { version = "0.25.2", features = ["serde"] }
accesskit_winit = "0.34.2"
arboard = { version = "3.7.0", default-features = false }
bitflags = { version = "2.13.2", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
color = "0.3.3"
rustc-hash = "2.1.3"
rustdoc-types = "0.61.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-map-kit = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-location = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-web-kit = "0.3.2"
slotmap = { version = "1.1.1", features = ["serde"] }
swash = "0.2.10"
kurbo = "0.13.1"
zeno = { version = "0.3.3", default-features = false, features = ["std", "eval"] }
proptest = "1.12.0"
parley = { version = "0.12.0", default-features = false, features = ["std", "complex-scripts"] }
png = "0.18.1"
roxmltree = "0.21.2"
pollster = "1.0.1"
unicode-segmentation = "1.13.3"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
wgpu = "30.0.1"
winit = "0.30.13"
octara = { path = "crates/octara" }
octara-fonts = { path = "crates/octara-fonts" }
octara-icons = { path = "crates/octara-icons" }
octara-kit = { path = "crates/octara-kit" }
octara-render = { path = "crates/octara-render" }
octara-shell = { path = "crates/octara-shell" }

# Dependencies (Parley's shaping above all) are optimized even in dev builds, so debug tests
# that lay out thousands of texts stay fast; workspace crates keep fast debug builds.
[profile.dev.package."*"]
opt-level = 2

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Octara headless parts regression</title>
<body data-result="waiting">
<div id="mount" style="width: 420px; height: 320px; margin: 30px 48px;"></div>
<output>Running the headless parts regression…</output>
<script type="module">
    import init, { HeadlessFixture } from "./headless.js";

    const mount = document.querySelector("#mount");
    const output = document.querySelector("output");
    const trusted = new URLSearchParams(location.search).has("trusted");
    const node = name => mount.querySelector(`[data-octara-id="${name}"]`);
    const named = (element, attr) => document.getElementById(element.getAttribute(attr));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const press = (element, key, options = {}) => {
        const init = { key, bubbles: true, cancelable: true, ...options };
        const handled = !element.dispatchEvent(new KeyboardEvent("keydown", init));
        element.dispatchEvent(new KeyboardEvent("keyup", init));
        return handled;
    };
    const rightClick = async (target, test, dx, dy, handled) => {
        const received = new Promise(resolve => mount.addEventListener("contextmenu", resolve, { once: true }));
        if (trusted) {
            document.body.dataset.result = `waiting-${test}`;
            output.value = `Right-click ${target.textContent}.`;
        } else {
            const { x, y } = target.getBoundingClientRect();
            const point = { clientX: x + dx, clientY: y + dy, bubbles: true, cancelable: true, button: 2 };
            const pointer = { ...point, pointerType: "mouse", pointerId: 1, isPrimary: true };
            target.dispatchEvent(new PointerEvent("pointerdown", { ...pointer, buttons: 2 }));
            target.dispatchEvent(new MouseEvent("contextmenu", point));
            target.dispatchEvent(new PointerEvent("pointerup", pointer));
        }
        const event = await received;
        assert(!trusted || event.isTrusted, "the browser generated the contextmenu event");
        assert(event.target === target, "contextmenu reached the caller's target");
        assert(event.cancelable && event.defaultPrevented === handled, `unexpected contextmenu cancellation on ${test}`);
        return event;
    };
    const until = async (condition, message) => {
        for (let frame = 0; frame < 120; frame++) {
            if (condition()) return;
            await new Promise(resolve => requestAnimationFrame(resolve));
        }
        throw new Error(message);
    };
    const menuAt = (x, y) => {
        const menu = node("context-items");
        assert(menu, "the caller's menu is mounted");
        const rect = menu.getBoundingClientRect();
        assert(Math.abs(rect.x - x) <= 0.5 && Math.abs(rect.y - y) <= 0.5,
            `menu placed at (${rect.x}, ${rect.y}), expected (${x}, ${y})`);
        return menu;
    };

    let fixture;
    try {
        await init();
        fixture = new HeadlessFixture(mount);
        const editor = node("editor");
        const label = node("field-label");
        assert(editor.tagName === "INPUT" && editor.value === "draft", "Field retains the caller's controlled editor");
        assert(named(editor, "aria-labelledby") === label && label.textContent === "Name",
            "Field labels the caller's editor");
        assert(named(editor, "aria-describedby") === node("field-description"), "Field describes the caller's editor");
        editor.focus();
        editor.setSelectionRange(1, 3, "backward");
        node("rename-field").click();
        assert(node("editor") === editor && document.activeElement === editor && editor.value === "draft",
            "changing the field label preserves the editor and its focus");
        assert(editor.selectionStart === 1 && editor.selectionEnd === 3 && editor.selectionDirection === "backward",
            "changing the field label preserves the editor selection");
        assert(named(editor, "aria-labelledby") === label && label.textContent === "Display name",
            "the renamed field label reaches the DOM in the same turn");

        const first = node("first-tab");
        const second = node("second-tab");
        const firstPanel = node("first-panel");
        const secondPanel = node("second-panel");
        const selected = tab => tab.getAttribute("aria-selected") === "true";
        const visible = panel => panel.getClientRects().length !== 0;
        assert(node("tab-list").getAttribute("role") === "tablist", "Tabs uses the caller's list");
        assert(named(first, "aria-controls") === firstPanel && named(firstPanel, "aria-labelledby") === first,
            "the initial tab and panel reference each other");
        assert(selected(first) && !selected(second) && visible(firstPanel) && !visible(secondPanel), "initial tab is selected");
        first.focus();
        assert(first.tabIndex === 0 && second.tabIndex === -1, "the initial tab is the only tab stop");
        assert(press(first, "ArrowRight") && document.activeElement === second, "ArrowRight moves focus to the next tab");
        assert(selected(first) && !selected(second) && visible(firstPanel) && !visible(secondPanel),
            "manual tabs keep the original selection and panel while focus moves");
        assert(first.tabIndex === -1 && second.tabIndex === 0, "the tab stop follows focus");
        press(second, "Enter");
        assert(document.activeElement === second && selected(second) && !selected(first) && visible(secondPanel) && !visible(firstPanel),
            "Enter selects the focused tab and displays its panel");
        assert(named(second, "aria-controls") === secondPanel && named(secondPanel, "aria-labelledby") === second,
            "the newly selected tab and panel reference each other");

        const trigger = node("context-trigger");
        const target = node("context-target");
        trigger.focus();
        const firstClick = await rightClick(target, "trigger", 104, 42, true);
        await until(() => node("context-items"), "right-click opens the caller's menu");
        const menu = menuAt(firstClick.clientX, firstClick.clientY);
        assert(menu.getAttribute("role") === "menu" && named(trigger, "aria-controls") === menu,
            "the caller's context trigger controls the caller's menu");
        assert(document.activeElement === node("context-item"), "right-click focuses the caller's menu item");
        const repeat = await rightClick(target, "repeat", 142, 24, true);
        await until(() => Math.abs(node("context-items")?.getBoundingClientRect().y - repeat.clientY) <= 0.5,
            "repeat right-click opens the caller's menu at the new pointer position");
        assert(named(trigger, "aria-controls") === menuAt(repeat.clientX, repeat.clientY),
            "the context trigger controls the menu after another right-click");
        assert(press(node("context-item"), "Escape") && !node("context-items") && document.activeElement === trigger,
            "Escape closes the menu and restores its trigger focus");

        const rect = trigger.getBoundingClientRect();
        for (const [key, options] of [["F10", { shiftKey: true }], ["ContextMenu", {}]]) {
            assert(press(trigger, key, options), `${key} opens the context menu`);
            menuAt(rect.x, rect.bottom);
            assert(press(node("context-item"), "Escape") && !node("context-items") && document.activeElement === trigger,
                "Escape restores trigger focus after keyboard invocation");
        }

        await rightClick(node("plain-region"), "plain", 30, 12, false);
        assert(!node("context-items"), "right-click outside the trigger leaves the menu closed");
        document.body.dataset.result = "passed";
        output.value = "Octara headless parts regression passed.";
    } catch (error) {
        document.body.dataset.result = "failed";
        output.value = error.stack || String(error);
        throw error;
    } finally {
        fixture?.free();
    }
</script>

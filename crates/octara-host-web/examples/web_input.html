<!doctype html>
<meta charset="utf-8">
<title>Octara browser input test</title>
<div id="mount" style="width: 500px; height: 300px"></div>
<pre id="output"></pre>
<script type="module">
import init, { WebInputFixture } from "./web_input.js";

const assert = (condition, message) => {
    if (!condition) throw new Error(message);
};
const node = name => document.querySelector(`[data-octara-id="${name}"]`);
const mount = document.getElementById("mount");
const output = document.getElementById("output");
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const within = async (condition, message, timeout = 1000) => {
    const deadline = performance.now() + timeout;
    while (!condition()) {
        assert(performance.now() < deadline, message);
        await wait(16);
    }
};
const dispatch = (element, event) => element.dispatchEvent(event);
const edit = (field, data, start, end) => {
    const options = { bubbles: true, cancelable: true, inputType: "insertText", data };
    assert(dispatch(field, new InputEvent("beforeinput", options)), "the browser's edit was unexpectedly canceled");
    field.setRangeText(data, start, end, "end");
    dispatch(field, new InputEvent("input", options));
};

try {
    await init();
    const app = new WebInputFixture(mount);
    assert(app.viewport_width() === 500, "initial viewport width differs from the mount");
    const button = node("press");
    const rect = button.getBoundingClientRect();
    const pointer = {
        bubbles: true, cancelable: true, pointerId: 1, pointerType: "mouse", isPrimary: true,
        button: 0, clientX: rect.x + 1, clientY: rect.y + 1,
    };
    dispatch(button, new PointerEvent("pointerdown", { ...pointer, buttons: 1 }));
    dispatch(button, new PointerEvent("pointerup", pointer));
    dispatch(button, new MouseEvent("click", { bubbles: true, detail: 1 }));
    assert(node("press-count").textContent === "1", "one pointer sequence should produce one activation");
    button.click();
    assert(node("press-count").textContent === "2", "a click without a contact should activate the button");

    const readPinches = () => JSON.parse(app.take_pinches()).map(event => event.pinch);
    const readUnclaimed = () => JSON.parse(app.take_unclaimed_gestures());
    const zone = node("drop-zone");
    const zoneBounds = zone.getBoundingClientRect();
    const zoneX = Math.trunc(zoneBounds.x) + 2;
    const zoneY = Math.trunc(zoneBounds.y) + 2;
    const at = mount.getBoundingClientRect();
    const zoom = { bubbles: true, cancelable: true, clientX: pointer.clientX, clientY: pointer.clientY, deltaY: -50 };
    assert(dispatch(button, new WheelEvent("wheel", zoom)), "ordinary wheel input was unexpectedly canceled");
    assert(!dispatch(button, new WheelEvent("wheel", { ...zoom, ctrlKey: true })), "a claimed pinch should cancel browser zoom");
    assert(!dispatch(zone, new WheelEvent("wheel", { ...zoom, clientX: zoneX, clientY: zoneY, ctrlKey: true })),
        "a wheel pinch lost its owner when its anchor moved to a sibling");
    await wait(160);
    const wheel = readPinches();
    assert(wheel.map(event => event.phase).join() === "started,changed,changed,ended", "unexpected wheel pinch phases");
    assert(wheel[1].scale > 1 && wheel[2].scale > wheel[1].scale && wheel[3].scale === wheel[2].scale,
        "wheel zoom should accumulate until the burst ends");
    assert(wheel[0].anchor.x === Math.trunc(zoom.clientX) - at.x && wheel[0].anchor.y === Math.trunc(zoom.clientY) - at.y,
        "wheel zoom anchor should use mount coordinates");
    assert(wheel[2].anchor.y === zoneY - at.y && readUnclaimed().length === 0, "wheel pinch lost its new anchor or reached the sibling");

    const touch = (type, id, x, target = button, y = pointer.clientY) => dispatch(target, new PointerEvent(type, {
        ...pointer, pointerId: id, pointerType: "touch", isPrimary: id === 2, clientX: x, clientY: y,
    }));
    const x = Math.trunc(pointer.clientX);
    touch("pointerdown", 2, x);
    touch("pointerdown", 3, x + 12);
    assert(!dispatch(button, new Event("touchstart", { bubbles: true, cancelable: true })),
        "a claimed touch pinch should cancel native touch handling");
    touch("pointermove", 3, x + 24);
    touch("pointerup", 3, x + 24);
    touch("pointerup", 2, x);
    const touchPinch = readPinches();
    assert(touchPinch.map(event => event.phase).join() === "started,changed,ended", "unexpected touch pinch phases");
    assert(touchPinch[1].scale === 2 && touchPinch[1].delta_scale === 2 && touchPinch[1].anchor.x === x + 12 - at.x,
        "touch zoom should report the distance ratio and the midpoint in mount coordinates");
    assert(node("press-count").textContent === "2", "a claimed pinch should cancel the active press");

    const unclaimedTouch = (type, id, offset = 0) => touch(type, id, zoneX + offset, zone, zoneY);
    unclaimedTouch("pointerdown", 2);
    unclaimedTouch("pointerdown", 3);
    assert(dispatch(zone, new Event("touchstart", { bubbles: true, cancelable: true })), "an unclaimed pair canceled native touch handling");
    await wait(550);
    assert(readUnclaimed().length === 0, "a coincident second touch left the long press armed");
    unclaimedTouch("pointermove", 3, 12);
    unclaimedTouch("pointerup", 3, 12);
    unclaimedTouch("pointerup", 2);
    assert(readUnclaimed().map(event => event.pinch?.phase).join() === "started,ended", "unclaimed pinch phases were lost");

    unclaimedTouch("pointerdown", 2);
    await within(() => readUnclaimed().some(event => event.long_press?.phase === "started"), "one touch stopped arming a long press");
    unclaimedTouch("pointerdown", 3, 12);
    assert(readUnclaimed().map(event => event.long_press?.phase ?? event.pinch?.phase).join() === "cancelled,started",
        "a pair should cancel a recognized long press before dispatching its pinch");
    unclaimedTouch("pointerup", 3, 12);
    unclaimedTouch("pointerup", 2);

    dispatch(button, new PointerEvent("pointermove", pointer));
    for (const [type, scale] of [["gesturestart", 1], ["gesturechange", 1.25], ["gestureend", 1.25]]) {
        const event = new Event(type, { bubbles: true, cancelable: true });
        Object.defineProperty(event, "scale", { value: scale });
        assert(!dispatch(button, event), "a claimed Safari gesture should cancel browser zoom");
    }
    const safari = readPinches();
    assert(safari.map(event => event.phase).join() === "started,changed,ended" && safari[1].delta_scale === 1.25
        && safari[1].anchor.x === x - at.x, "Safari gesture should use the cursor when the event lacks an anchor");

    const letter = key => new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true });
    button.focus();
    assert(!dispatch(button, letter("Tab")), "an authored Tab shortcut did not consume the key");
    const field = node("editor");
    field.focus();
    assert(!dispatch(field, letter("F2")) && node("shortcut-count").textContent === "2",
        "a focused editor did not deliver the authored shortcut");
    assert(field.value === "a😀b", "the native editor did not receive the initial value");
    field.setSelectionRange(1, 3, "backward");
    dispatch(field, new Event("select", { bubbles: true }));
    assert(app.selection().join() === "5,1", "a backward selection did not preserve UTF-8 byte direction");
    edit(field, "界", 1, 3);
    assert(app.value() === "a界b" && field.value === "a界b", "the controlled editor dropped an accepted edit");
    edit(field, "!", 2, 2);
    assert(app.value() === "a界b" && field.value === "a界b", "the browser retained a rejected edit");
    assert(!dispatch(field, new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true, cancelable: true }))
        && node("key-count").textContent === "1", "the editor did not intercept a consumed navigation key");

    const composition = (type, data) => dispatch(field, new CompositionEvent(type, { bubbles: true, data }));
    field.setSelectionRange(2, 2);
    composition("compositionstart", "");
    composition("compositionupdate", "你");
    field.setRangeText("你", 2, 2, "end");
    dispatch(field, new InputEvent("input", { bubbles: true, inputType: "insertCompositionText", data: "你", isComposing: true }));
    assert(app.marked() && field.value === "a界你b" && app.value() === "a界b", "an IME draft became a committed edit");
    composition("compositionend", "你");
    await within(() => !app.marked(), "the IME commit did not finish");
    assert(app.value() === "a界你b" && field.value === app.value(), "the IME commit was lost or applied twice");

    const dropLabel = node("drop-label");
    const dropRect = dropLabel.getBoundingClientRect();
    const drag = (type, target, dataTransfer, at) => dispatch(target, new DragEvent(type, {
        bubbles: true, cancelable: true, dataTransfer, clientX: at.x + 1, clientY: at.y + 1,
    }));
    const files = new DataTransfer();
    files.items.add(new File(["abc"], "alpha.txt"));
    files.items.add(new File(["def"], "beta.txt"));
    assert(drag("dragover", button, files, rect), "dragover outside a drop receiver should remain unhandled");
    assert(drag("drop", button, files, rect), "drop outside a drop receiver should remain unhandled");
    assert(drag("dragover", dropLabel, new DataTransfer(), dropRect), "dragover without files should remain unhandled");
    assert(!drag("dragover", dropLabel, files, dropRect), "a drop receiver should accept a file drag over its child");
    assert(!drag("drop", dropLabel, files, dropRect), "a file drop should be handled");
    assert(node("dropped-files").textContent === "alpha.txt,beta.txt", "the app did not receive the browser file names in order");

    const dragSource = node("drag-source");
    assert(dragSource.draggable, "an authored drag source should opt in to native dragging");
    const outbound = new DataTransfer();
    assert(drag("dragstart", dragSource, outbound, dragSource.getBoundingClientRect()), "native drag was canceled");
    assert(outbound.getData("text/plain") === "Drag test text", "the drag did not offer UTF-8 text");
    assert(outbound.files.length === 1 && outbound.files[0].type === "image/png", "the drag did not offer the image file");
    assert(outbound.files[0].name === "image.png" && outbound.files[0].size === 70, "the drag image is incomplete");
    const declined = node("declined-drag");
    const empty = new DataTransfer();
    assert(!drag("dragstart", declined, empty, declined.getBoundingClientRect()), "a declined drag started");
    assert(empty.items.length === 0, "a declined drag exposed data");

    if (new URLSearchParams(location.search).has("trusted-drag")) {
        await new Promise((resolve, reject) => {
            dragSource.scrollIntoView({ block: "center" });
            const bounds = dragSource.getBoundingClientRect();
            window.octaraDragStart = { x: Math.floor(bounds.x + 16), y: Math.floor(bounds.y + bounds.height / 2) };
            document.addEventListener("dragstart", event => {
                try {
                    assert(event.isTrusted && dragSource.contains(event.target), "expected a trusted drag of the Octara source");
                    assert(!event.defaultPrevented && event.dataTransfer.getData("text/plain") === "Drag test text",
                        "the DataTransfer was not populated during the trusted drag");
                    const images = Array.from(event.dataTransfer.files);
                    assert(images.length === 1 && images[0].type === "image/png", "the trusted drag image is missing");
                    resolve();
                } catch (error) {
                    reject(error);
                }
            }, { once: true });
        });
    }

    mount.style.width = "360px";
    await within(() => app.viewport_width() === 360, "ResizeObserver did not update the viewport");
    const gpuNode = node("gpu-canvas");
    if (gpuNode) {
        const required = new URLSearchParams(location.search).has("webgpu");
        await within(
            () => gpuNode.dataset.octaraGpu !== undefined && gpuNode.dataset.octaraGpu !== "pending",
            "WebGPU initialization did not finish",
            5000,
        );
        const status = gpuNode.dataset.octaraGpu;
        assert(status === "submitted" || (!required && status === "unavailable"), `WebGPU canvas was ${status}`);
        if (status === "submitted") {
            const canvas = gpuNode.querySelector("canvas");
            assert(canvas.width > 0 && canvas.height > 0 && getComputedStyle(canvas).visibility === "visible", "the WebGPU canvas was not presented");
        }
        document.body.dataset.webgpu = status;
    }
    app.free();
    assert(mount.childElementCount === 0, "dropping the WebApp left its mounted DOM in place");
    document.body.dataset.result = "passed";
    output.textContent = "Browser input and lifecycle passed";
} catch (error) {
    document.body.dataset.result = "failed";
    output.textContent = error.stack || String(error);
}
</script>

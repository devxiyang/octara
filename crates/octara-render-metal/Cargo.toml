[package]
name = "octara-render-metal"
description = "Native Metal encoding for Octara's device-free render plans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = []
custom-wgsl = ["dep:naga"]
wgpu = ["octara-render/wgpu"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
octara-model.workspace = true
octara-render = { workspace = true, features = ["plan"] }
block2.workspace = true
objc2.workspace = true
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std", "objc2", "objc2-metal", "CVBase", "CVBuffer", "CVImageBuffer", "CVMetalTexture",
    "CVMetalTextureCache", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface",
] }
objc2-foundation.workspace = true
objc2-io-surface = { version = "0.3.2", default-features = false, features = [
    "std", "objc2", "objc2-core-foundation", "IOSurfaceRef",
] }
objc2-metal = { workspace = true, features = [
    "std", "block2", "MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer",
    "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDepthStencil", "MTLDevice",
    "MTLDrawable", "MTLLibrary", "MTLPipeline", "MTLPixelFormat", "MTLRenderCommandEncoder",
    "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLSampler", "MTLTexture", "MTLTypes", "objc2-io-surface",
] }
naga = { version = "30.0.2", optional = true, default-features = false, features = ["wgsl-in", "msl-out"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFNumber"] }
octara-fonts = { workspace = true, features = ["cjk"] }
swash.workspace = true

[package]
name = "octara"
description = "Agent-first native UI in Rust: signals, incremental collections, retained tree, headless runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["svg"]
# `Icon::svg`: icons from SVG source (an XML parser). The bundled icons do not need it.
svg = ["octara-primitives/svg"]
# The platform's installed fonts and fallback (CJK, emoji, symbols) for real windows. Headless
# runs leave it off and use the bundled faces only, so results do not depend on the machine.
system-fonts = ["octara-text/system-fonts"]

[dependencies]
octara-primitives.workspace = true
octara-macros = { path = "../octara-macros" }
accesskit.workspace = true
bitflags.workspace = true
color.workspace = true
unicode-segmentation.workspace = true
octara-text.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
taffy.workspace = true

[dev-dependencies]
png.workspace = true
proptest.workspace = true

[package]
name = "octara-render"
description = "Device-free frame planning, a CPU reference renderer, and an optional wgpu renderer for Octara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = ["plan"]
plan = ["dep:octara-model", "dep:bytemuck", "dep:half", "dep:color", "dep:rustc-hash", "dep:swash", "dep:kurbo", "dep:zeno"]
wgpu = ["plan", "dep:wgpu", "dep:web-time"]

[dependencies]
bytemuck = { workspace = true, optional = true }
color = { workspace = true, optional = true }
half = { version = "2.7.1", optional = true }
octara-model = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
swash = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
zeno = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
octara-fonts = { workspace = true, features = ["cjk"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["plan"]

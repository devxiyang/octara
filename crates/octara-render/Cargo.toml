[package]
name = "octara-render"
description = "Renderers for Octara's display list: a deterministic CPU reference renderer (screenshots) and a wgpu renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = ["gpu"]
# The wgpu renderer.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:web-time", "dep:half"]

[dependencies]
bytemuck = { workspace = true, optional = true }
color.workspace = true
half = { version = "2.7.1", optional = true }
octara-model.workspace = true
wgpu = { workspace = true, optional = true }
rustc-hash.workspace = true
swash.workspace = true
kurbo.workspace = true
zeno.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
octara-fonts = { workspace = true, features = ["cjk"] }

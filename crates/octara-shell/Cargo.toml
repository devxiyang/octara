[package]
name = "octara-shell"
description = "Desktop windows for Octara apps: winit events in, the GPU renderer out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit_winit.workspace = true
arboard.workspace = true
open.workspace = true
octara = { workspace = true, features = ["system-fonts"] }
octara-render.workspace = true
pollster.workspace = true
winit.workspace = true

# Native views (AppKit, WebKit) and the frame's Core Animation transaction.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-location.workspace = true
objc2-foundation.workspace = true
objc2-map-kit.workspace = true
objc2-quartz-core.workspace = true
objc2-web-kit.workspace = true
serde_json.workspace = true

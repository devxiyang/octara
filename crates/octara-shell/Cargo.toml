[package]
name = "octara-shell"
description = "Winit windows and GPU presentation for Octara apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
octara-primitives.workspace = true
accesskit_winit.workspace = true
octara = { workspace = true, features = ["system-fonts"] }
octara-render.workspace = true
pollster.workspace = true
tempfile.workspace = true
winit.workspace = true

[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard = { workspace = true, features = ["image-data"] }
open.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-ui-kit = { workspace = true, features = [
    "std", "block2", "objc2-core-foundation",
    "UIAccessibility", "UIColor", "UIControl", "UIEvent", "UIGeometry", "UIGestureRecognizer", "UIKeyboardLayoutGuide", "UILayoutGuide", "UITrackingLayoutGuide",
    "UINavigationController", "UIResponder", "UIScene", "UISceneOptions", "UISceneSession", "UITextField", "UITextInput",
    "UIScrollView", "UITextInputTraits", "UITextView", "UIView", "UIViewController", "UIViewControllerTransitionCoordinator", "UIWindow", "UIWindowScene",
] }

# Native views (AppKit, WebKit) and the frame's Core Animation transaction.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-location.workspace = true
objc2-foundation.workspace = true
objc2-map-kit.workspace = true
objc2-metal = { workspace = true, features = [
    "std", "block2", "objc2-core-foundation", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice",
    "MTLDrawable", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLResource", "MTLTexture",
] }
objc2-quartz-core = { workspace = true, features = ["CAMetalLayer", "objc2-metal"] }
objc2-web-kit.workspace = true
serde_json.workspace = true

[package]
name = "octara-cli"
description = "The `octara` command: the framework's API, usage and diagnostics for agents and people."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../docs/start-here.md"
keywords.workspace = true
categories.workspace = true
publish = true

[[bin]]
name = "octara"
path = "src/main.rs"

[dependencies]
clap.workspace = true
flate2.workspace = true
octara.workspace = true
octara-inspect.workspace = true
octara-model.workspace = true
octara-release = { workspace = true, features = ["signing"] }
plist = { version = "1.10", default-features = false }
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
octara-kit.workspace = true
octara-markdown.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

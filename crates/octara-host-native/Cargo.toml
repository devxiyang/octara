[package]
name = "octara-host-native"
description = "Native Octara host orchestration and OS services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[[test]]
name = "native_window"
harness = false

[[test]]
name = "macos_chrome"
harness = false

[[test]]
name = "macos_input"
harness = false

[[test]]
name = "macos_drag_panel"
harness = false

[dependencies]
accesskit.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
sha2.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net"] }
octara.workspace = true
octara-gpu.workspace = true
octara-model.workspace = true
octara-pipeline = { workspace = true, features = ["system-fonts"] }
octara-render = { workspace = true, features = ["gpu"] }
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
raw-window-handle = "0.6.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5.0"
futures-lite = "2.6.1"
x11rb = { version = "0.13.2", features = ["cursor", "dl-libxcb", "xkb"] }
x11-dl = "2.21.0"
xkbcommon-dl = { version = "0.4.2", features = ["x11"] }
accesskit_unix = "0.24.1"
calloop = "0.13.0"
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }
wayland-cursor = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
url = "2.5.8"
open.workspace = true
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "ios")'.dependencies]
accesskit_consumer = "0.39.2"
dispatch2 = "0.3.1"
block2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-ui-kit = { workspace = true, features = [
    "std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core",
    "NSLayoutAnchor", "NSLayoutConstraint", "UIKeyboardLayoutGuide", "UITrackingLayoutGuide",
    "UIApplication", "UIPasteboard", "UIScreenEdgePanGestureRecognizer", "UIPanGestureRecognizer", "UIPinchGestureRecognizer", "UIRotationGestureRecognizer",
    "UIAccessibility", "UIAccessibilityConstants", "UIAccessibilityContainer", "UIAccessibilityElement", "UIColor", "UICommand", "UIContentSizeCategory", "UIEvent", "UIFont", "UIFontDescriptor", "UIGeometry", "UIGestureRecognizer", "UIInterface", "UILayoutGuide", "UIOpenURLContext", "UIScreen",
    "UIImage", "NSText", "UITrait", "UITraitCollection", "UINavigationController", "UIResponder", "UIScene", "UISceneConfiguration", "UIWindowSceneGeometry", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UITextInput",
    "NSAttributedString", "UIHoverGestureRecognizer", "UIKey", "UIKeyCommand", "UIKeyConstants", "UIMenuElement", "UIPress", "UIPressesEvent", "UITouch",
    "UITextInputTraits", "UIView", "UIViewController", "UIViewControllerTransitionCoordinator", "UIWindow", "UIWindowScene",
] }

# AppKit views and the frame's Core Animation transaction.
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27.2"
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-location.workspace = true
objc2-foundation.workspace = true
objc2-map-kit.workspace = true
objc2-metal = { workspace = true, features = [
    "std", "block2", "objc2-core-foundation", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice",
    "MTLDrawable", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLResource", "MTLTexture",
] }
objc2-quartz-core = { workspace = true, features = ["CADisplayLink", "CAFrameRateRange", "CAMetalLayer", "objc2-metal"] }

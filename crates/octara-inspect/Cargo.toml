[package]
name = "octara-inspect"
description = "Octara's inspection protocol, replay and deterministic simulation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
octara.workspace = true
octara-model.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
octara-pipeline = { workspace = true, optional = true }
octara-render = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["native"]
native = ["dep:octara-pipeline", "dep:octara-render"]
